# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android — analysieren, testen, APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform einrichten (android/ios, Name, Icon)
        run: bash scripts/setup_platforms.sh

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Release-APK bauen
        run: flutter build apk --release

      - name: APK benennen
        id: apk
        run: |
          v=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          name="RIMPERIO-${v}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      # Play Store: nur mit hinterlegtem Upload-Schlüssel (Secrets, siehe
      # scripts/create_upload_key.sh). Ohne Secrets — z. B. bei PRs aus
      # Forks — wird dieser Teil übersprungen.
      - name: Upload-Schlüssel einrichten
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Keine Signatur-Secrets — AAB wird nicht gebaut."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Play-Store-Bundle (AAB) bauen
        if: steps.key.outputs.signed == 'true'
        id: aab
        run: |
          flutter build appbundle --release
          v=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          name="RIMPERIO-${v}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: android-aab
          path: ${{ steps.aab.outputs.name }}
          retention-days: 30

      - name: Schlüssel entfernen
        if: always()
        run: rm -f key.properties "$RUNNER_TEMP/upload-keystore.jks"

  ios:
    name: iOS — bauen (ohne Signatur)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform einrichten (android/ios, Name, Icon)
        run: bash scripts/setup_platforms.sh

      - name: iOS bauen
        run: flutter build ios --release --no-codesign

  release:
    name: GitHub-Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag bestimmen
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            v=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            tag="v${v}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "Tag ${tag} gibt es schon – kein neues Release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          name: android-apk
          path: dist

      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RIMPERIO-App ${{ steps.tag.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
