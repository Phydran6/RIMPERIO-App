# ---------------------------------------------------------------------------
# Datei:        .github/workflows/ci.yml
# Projekt:      RIMPERIO-App
# Autor:        Phydran6
# Version:      2026.11.24.12.00.00
# Beschreibung: Bei jedem Push/PR: Plattform-Ordner erzeugen, analysieren,
#               testen, Android-APK, Play-Store-Bundle (AAB, nur mit
#               Signatur-Secrets) und iOS (unsigniert) bauen.
#
#               Versionen vergibt die CI selbst — in pubspec.yaml muss
#               nichts geändert werden:
#                 Name  = Datum (Europe/Berlin), z. B. 2026.11.23;
#                         gibt es den Tag schon: 2026.11.23.2, .3, …
#                 Code  = 100 + fortlaufende Laufnummer (steigt immer —
#                         das verlangt der Play Store)
#
#               Release (Tag v<Name>, APK + AAB) entsteht automatisch bei
#               einem Push auf main, wenn sich seit dem letzten Release an
#               der App etwas geändert hat (lib/, assets/, pubspec.yaml,
#               scripts/setup_platforms.sh, scripts/self_update_permission.sh,
#               scripts/android/). Reine Doku-/CI-Änderungen
#               lösen keins aus. "Run workflow" auf main erzwingt eins.
#
#               Signatur: APK und AAB mit demselben Upload-Schlüssel (Secrets).
#               Nur so lässt sich die APK über die vorige drüber installieren —
#               und damit auch per Knopfdruck aus der App (Mehr → App-Update).
#               Das AAB (Play Store) wird ohne REQUEST_INSTALL_PACKAGES gebaut,
#               die APK mit.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version und Änderungen erkennen
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ganze Historie + Tags für den Vergleich

      - name: Version bestimmen
        id: v
        env:
          RUN_NUMBER: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          code=$((100 + RUN_NUMBER))
          base=$(TZ=Europe/Berlin date +%Y.%-m.%-d)
          name="$base"; n=1
          while git rev-parse -q --verify "refs/tags/v${name}" >/dev/null; do
            n=$((n + 1)); name="${base}.${n}"
          done

          release=false
          if [ "$REF" = "refs/heads/main" ]; then
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "Von Hand gestartet → Release."
              release=true
            elif [ "$EVENT" = "push" ]; then
              if [ -z "$last" ]; then
                echo "Noch kein Release → Release."
                release=true
              elif git diff --quiet "$last" HEAD -- lib assets pubspec.yaml scripts/setup_platforms.sh scripts/self_update_permission.sh scripts/android; then
                echo "Keine App-Änderung seit $last → kein Release."
              else
                echo "App geändert seit $last:"
                git diff --stat "$last" HEAD -- lib assets pubspec.yaml scripts/setup_platforms.sh scripts/self_update_permission.sh scripts/android
                release=true
              fi
            fi
          fi

          echo "Version $name (Code $code), Release: $release"
          {
            echo "name=$name"
            echo "code=$code"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android — analysieren, testen, APK, AAB
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NAME: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform einrichten (android/ios, Name, Icon)
        # Erst ohne Selbst-Update-Berechtigung — so geht das AAB in den Play Store.
        run: RIMPERIO_SELF_UPDATE=0 bash scripts/setup_platforms.sh

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      # Upload-Schlüssel (Secrets, siehe scripts/create_upload_key.sh) für AAB
      # und APK. Ohne Secrets — z. B. bei PRs aus Forks — bleibt es beim
      # Debug-Schlüssel und es gibt kein AAB.
      - name: Upload-Schlüssel einrichten
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Keine Signatur-Secrets — APK mit Debug-Schlüssel, kein AAB."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Play-Store-Bundle (AAB) bauen — ohne Selbst-Update
        if: steps.key.outputs.signed == 'true'
        run: |
          if grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml; then
            echo "::error::REQUEST_INSTALL_PACKAGES darf nicht ins Play-Store-Bundle."; exit 1
          fi
          flutter build appbundle --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          cp build/app/outputs/bundle/release/app-release.aab "RIMPERIO-${BUILD_NAME}-${BUILD_NUMBER}.aab"
          ls -lh RIMPERIO-*.aab
          # Fingerabdruck ins Protokoll — muss zum Upload-Schlüssel in der
          # Play Console passen (Einstellungen → App-Integrität).
          keytool -printcert -jarfile RIMPERIO-*.aab | grep -E 'SHA1|SHA256'

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: android-aab
          path: RIMPERIO-*.aab
          retention-days: 30

      - name: Release-APK bauen — mit Selbst-Update
        run: |
          bash scripts/self_update_permission.sh on
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "RIMPERIO-${BUILD_NAME}.apk"
          ls -lh RIMPERIO-*.apk
          # Berechtigung und Signatur ins Protokoll. Der Fingerabdruck muss
          # von Release zu Release gleich bleiben — sonst lehnt Android das
          # Update ab.
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump permissions "RIMPERIO-${BUILD_NAME}.apk" | grep -q REQUEST_INSTALL_PACKAGES \
            || { echo "::error::APK ohne REQUEST_INSTALL_PACKAGES"; exit 1; }
          "$BT/apksigner" verify --print-certs "RIMPERIO-${BUILD_NAME}.apk" | grep -E 'DN|SHA-256'

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: RIMPERIO-*.apk
          retention-days: 30

      - name: Schlüssel entfernen
        if: always()
        run: rm -f key.properties "$RUNNER_TEMP/upload-keystore.jks"

  ios:
    name: iOS — bauen (ohne Signatur)
    needs: [version]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform einrichten (android/ios, Name, Icon)
        run: bash scripts/setup_platforms.sh

      - name: iOS bauen
        run: >-
          flutter build ios --release --no-codesign
          --build-name "${{ needs.version.outputs.name }}"
          --build-number "${{ needs.version.outputs.code }}"

  release:
    name: GitHub-Release
    if: needs.version.outputs.release == 'true'
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: android-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: RIMPERIO-App v${{ needs.version.outputs.name }}
          body: |
            Version **${{ needs.version.outputs.name }}** · Versionscode **${{ needs.version.outputs.code }}**

            - `RIMPERIO-${{ needs.version.outputs.name }}.apk` — direkt aufs Handy installieren; danach aktualisiert sich die App per Knopfdruck (Mehr → App-Update)
            - `RIMPERIO-${{ needs.version.outputs.name }}-${{ needs.version.outputs.code }}.aab` — für die Google Play Console
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true
